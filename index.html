<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Reloading (F5) restores the browser's remembered scroll position by
         default, which can land mid-page before layout has settled — kills
         the dark-hero-with-cursor-spotlight first impression. Force every
         load to start at the top instead. -->
    <script>
      if ("scrollRestoration" in history) history.scrollRestoration = "manual";
      window.scrollTo(0, 0);
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/flowers/flower1.PNG" />
    <link rel="icon" type="image/png" sizes="16x16" href="/flowers/flower1.PNG" />
    <link rel="apple-touch-icon" sizes="180x180" href="/flowers/flower1.PNG" />

    <!-- Primary SEO -->
    <title>KAIRUXS — Social Media Specialist | SMM · Content Creator · UGC</title>
    <meta name="description" content="KIRA — Social Media Specialist, Content Creator & UGC. I build SMM strategies and content that grow brands across UA, SK and DE. Let's build yours." />
    <meta name="keywords" content="SMM specialist, social media manager, content creator, UGC, brand strategy, Instagram marketing, KAIRUXS, KIRA, Slovakia, Ukraine" />
    <meta name="author" content="KIRA — KAIRUXS" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://kairuxs.com" />

    <!-- Fonts: preconnect only — @import in base.css still loads Orbitron/Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Theme -->
    <meta name="theme-color" content="#E9A6B5" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kairuxs.com" />
    <meta property="og:site_name" content="KAIRUXS" />
    <meta property="og:title" content="KAIRUXS — Social Media Specialist" />
    <meta property="og:description" content="I build SMM strategies and content that grow brands. Brands people actually stop and look at." />
    <meta property="og:image" content="https://kairuxs.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="KAIRUXS — Social Media Specialist" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ru_UA" />
    <meta property="og:locale:alternate" content="sk_SK" />
    <meta property="og:locale:alternate" content="de_DE" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KAIRUXS — Social Media Specialist" />
    <meta name="twitter:description" content="I build SMM strategies and content that grow brands. Brands people actually stop and look at." />
    <meta name="twitter:image" content="https://kairuxs.com/og-image.jpg" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "KIRA",
      "alternateName": "KAIRUXS",
      "url": "https://kairuxs.com",
      "image": "https://kairuxs.com/og-image.jpg",
      "jobTitle": "Social Media Specialist",
      "description": "SMM Specialist, Content Creator and UGC. Building brand presence across UA, SK and DE since 2020.",
      "knowsAbout": ["Social Media Marketing", "Content Creation", "UGC", "Brand Strategy", "Instagram Marketing"],
      "sameAs": [
        "https://instagram.com/smm.kairuxs",
        "https://t.me/kairuxsmm"
      ],
      "offers": {
        "@type": "Offer",
        "description": "SMM strategy, content creation, UGC and brand management services"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
